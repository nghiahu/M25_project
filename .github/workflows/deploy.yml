name: Deploy to Production

on:
  push:
    branches:
      - master
      - main
      - production

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/m25-frontend
  BACKEND_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/m25-backend
  COMPOSE_FILE: docker-compose.yml

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    outputs:
      frontend-tag: ${{ steps.frontend-meta.outputs.tags }}
      backend-tag: ${{ steps.backend-meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Frontend Image
      - name: Extract frontend metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.run_number }}

      - name: Build and push frontend Docker image
        id: frontend-build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Backend Image
      - name: Extract backend metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.run_number }}

      - name: Build and push backend Docker image
        id: backend-build
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://ngo-huu-nghia-k23.rikkeieducation.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Navigate to project directory
            cd ${{ secrets.PROJECT_PATH }}
            
            # Create .env file from secrets and build info
            cat > .env << EOF
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_HOST=postgres
            DB_PORT=5432
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=https://api.ngo-huu-nghia-k23.rikkeieducation.com
            FRONTEND_PORT=3000
            BACKEND_PORT=8080
            DOMAIN=ngo-huu-nghia-k23.rikkeieducation.com
            API_DOMAIN=api.ngo-huu-nghia-k23.rikkeieducation.com
            DOCKER_REGISTRY=${{ env.REGISTRY }}
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            FRONTEND_TAG=latest
            BACKEND_TAG=latest
            EOF
            
            # Pull latest code
            echo "Pulling latest code..."
            git pull origin main || git pull origin master || true
            
            # Login to Docker Hub
            echo "Logging in to Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin || exit 1
            
            # Pull latest Docker images
            echo "Pulling Docker images..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || { echo "Failed to pull frontend image"; exit 1; }
            docker pull ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest || { echo "Failed to pull backend image"; exit 1; }
            
            # Verify images exist
            echo "Verifying images..."
            docker image ls | grep -E "m25-frontend|m25-backend"
            
            # Stop and remove old containers
            echo "Stopping old containers..."
            docker-compose down --remove-orphans || true
            
            # Start new containers
            echo "Starting new containers..."
            docker-compose up -d || { echo "docker-compose up failed"; docker-compose logs; exit 1; }
            
            # Wait for services to stabilize
            echo "Waiting for services to be healthy..."
            sleep 10
            
            # Check container status
            echo "Container status:"
            docker-compose ps
            docker ps

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}

            echo "=== Verifying Deployment ==="
            
            # Check if containers are running
            echo -e "\n[1/6] Container Status:"
            containers_running=$(docker ps --format '{{.Names}}' | wc -l)
            echo "Running containers: $containers_running"
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
            
            # Show docker-compose services
            echo -e "\n[2/6] Docker Compose Status:"
            docker-compose ps || echo "docker-compose ps failed"
            
            # Show logs of all services
            echo -e "\n[3/6] Recent Logs (last 20 lines):"
            docker-compose logs --tail=20 2>&1 || true
            
            # Wait a bit more for services to start
            sleep 15
            
            # Test frontend health
            echo -e "\n[4/6] Testing Frontend Health..."
            frontend_health=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "000")
            echo "Frontend health status: $frontend_health"
            
            # Test backend health  
            echo -e "\n[5/6] Testing Backend Health..."
            backend_health=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 2>/dev/null || echo "000")
            echo "Backend health status: $backend_health"
            
            # Test nginx health
            echo -e "\n[6/6] Testing Nginx Health..."
            nginx_health=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health 2>/dev/null || echo "000")
            echo "Nginx health status: $nginx_health"
            
            # If still not healthy, show detailed logs
            if [ "$frontend_health" != "200" ] || [ "$backend_health" != "200" ]; then
              echo -e "\n❌ Health checks failed. Showing detailed logs:"
              echo -e "\n=== Frontend Logs ==="
              docker-compose logs frontend || true
              echo -e "\n=== Backend Logs ==="
              docker-compose logs backend || true
              echo -e "\n=== Database Logs ==="
              docker-compose logs postgres || true
              echo -e "\n=== Nginx Logs ==="
              docker-compose logs nginx || true
              exit 1
            fi
            
            echo -e "\n✅ Deployment verification successful!"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    
    steps:
      - name: Rollback deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "Rolling back to previous version..."
            cd ${{ secrets.PROJECT_PATH }}
            
            # Restart with previous image
            docker-compose down
            docker-compose pull
            docker-compose up -d
            
            echo "Rollback completed"

      - name: Notify failure
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Deployment failed and was rolled back. Check the workflow logs for details.'
            })
